[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'no build needed'"

[functions]
  node_bundler = "esbuild"

# Karma Yatra was renamed to Mukteshwar Yatra; keep old links working.
[[redirects]]
  from = "/karma-yatra.html"
  to = "/mukteshwar-yatra.html"
  status = 301
  force = true

[[redirects]]
  from = "/karma-yatra"
  to = "/mukteshwar-yatra.html"
  status = 301
  force = true
